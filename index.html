<style>
  :root{
    --red:#D6242F;
    --red-dark:#A81B24;
    --red-tint:#FBE9EA;
    --ink:#191A1E;
    --ink-soft:#4A4C54;
    --paper:#F6F4F1;
    --card:#FFFFFF;
    --line:#E4E1DA;
    --navy:#1B2A4A;
    --amber:#C98A2C;
    --teal:#2C6E68;
    --male:#1B2A4A;
    --female:#D6242F;
    --shadow: 0 1px 2px rgba(25,26,30,0.04), 0 6px 20px rgba(25,26,30,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--paper); color:var(--ink); font-family:'Red Hat Text',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Red Hat Display',sans-serif; letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .topbar{
    background:var(--ink); color:#fff; padding:0 28px;
    display:flex; align-items:center; justify-content:space-between;
    height:64px; position:sticky; top:0; z-index:50;
    border-bottom:3px solid var(--red);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:34px;height:34px; background:var(--red); display:flex; align-items:center; justify-content:center;
    font-family:'Red Hat Display',sans-serif; font-weight:900; font-size:18px; color:#fff;
  }
  .brand-text{line-height:1.1;}
  .brand-text .t1{font-family:'Red Hat Display',sans-serif; font-weight:700; font-size:15px;}
  .brand-text .t2{font-size:11px; color:#B9BBC4; text-transform:uppercase; letter-spacing:.08em;}
  .topbar-right{display:flex; align-items:center; gap:14px; font-size:12px; color:#B9BBC4;}
  .topbar-right .dot{width:6px;height:6px;background:#39C46A;border-radius:50%;display:inline-block;margin-right:6px;}
  .export-btn{
    appearance:none; border:1px solid #3A3B42; background:#24252B; color:#fff; cursor:pointer;
    font-family:'Red Hat Text',sans-serif; font-weight:600; font-size:11.5px; padding:7px 12px;
    display:flex; align-items:center; gap:6px; transition:background .15s;
  }
  .export-btn:hover{background:var(--red); border-color:var(--red);}

  .nav{
    background:var(--card); border-bottom:1px solid var(--line);
    display:flex; gap:2px; padding:0 24px; overflow-x:auto; position:sticky; top:64px; z-index:40;
  }
  .nav button{
    appearance:none; border:none; background:none; cursor:pointer;
    font-family:'Red Hat Text',sans-serif; font-weight:600; font-size:13.5px; color:var(--ink-soft);
    padding:16px 16px 13px; border-bottom:3px solid transparent; white-space:nowrap;
    transition:color .15s;
  }
  .nav button:hover{color:var(--ink);}
  .nav button.active{color:var(--red); border-bottom-color:var(--red);}

  main{max-width:1360px; margin:0 auto; padding:28px 24px 80px;}
  .view{display:none;}
  .view.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .section-title{
    display:flex; align-items:baseline; justify-content:space-between; margin:36px 0 14px;
  }
  .section-title h2{font-size:19px; font-weight:700;}
  .section-title .sub{font-size:12.5px; color:var(--ink-soft);}
  .section-title:first-child{margin-top:0;}

  .kpi-row{display:grid; grid-template-columns:repeat(6,1fr); gap:12px;}
  .kpi{
    background:var(--card); border:1px solid var(--line); padding:16px 16px 14px;
    position:relative; overflow:hidden;
  }
  .kpi::before{content:'';position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--red);}
  .kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600;}
  .kpi .value{font-family:'Red Hat Display',sans-serif; font-size:28px; font-weight:900; margin-top:6px; line-height:1;}
  .kpi .foot{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}
  .kpi .foot b{color:var(--ink);}

  .grid{display:grid; gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  .grid-2-1{grid-template-columns:2fr 1fr;}
  .grid-1-2{grid-template-columns:1fr 2fr;}
  .grid-1{grid-template-columns:1fr;}
  .card{
    background:var(--card); border:1px solid var(--line); padding:18px 20px;
  }
  .card h3{font-size:13.5px; font-weight:700; margin-bottom:2px;}
  .card .card-sub{font-size:11.5px; color:var(--ink-soft); margin-bottom:14px;}
  .chart-wrap{position:relative; height:260px;}
  .chart-wrap.short{height:200px;}
  .chart-wrap.tall{height:340px;}

  .legend-list{list-style:none; margin-top:10px; font-size:12.5px;}
  .legend-list li{display:flex; align-items:center; justify-content:space-between; padding:5px 0; border-bottom:1px dashed var(--line);}
  .legend-list li:last-child{border-bottom:none;}
  .legend-list .sw{width:10px;height:10px; display:inline-block; margin-right:8px; flex:none;}
  .legend-list .name{display:flex; align-items:center; color:var(--ink-soft);}
  .legend-list .val{font-weight:700; font-family:'JetBrains Mono',monospace; font-size:12px;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); font-weight:700; padding:9px 10px; border-bottom:2px solid var(--ink);
    position:sticky; top:0; background:var(--card); cursor:pointer; user-select:none;
  }
  th:hover{color:var(--red);}
  td{padding:9px 10px; border-bottom:1px solid var(--line); color:var(--ink);}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:var(--red-tint);}
  .tbl-wrap{max-height:520px; overflow:auto; border:1px solid var(--line);}
  .pill{
    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .pill.m{background:#EAEEF5; color:var(--navy);}
  .pill.f{background:var(--red-tint); color:var(--red);}
  .pill.dept{background:#F1F0EC; color:var(--ink-soft);}
  .pill.term{background:#FBE9EA; color:var(--red);}
  .pill.resign{background:#EAF2F1; color:var(--teal);}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
  .filters input[type=text]{
    border:1px solid var(--line); padding:8px 12px; font-size:12.5px; font-family:inherit;
    min-width:220px; background:#fff;
  }
  .filters select{
    border:1px solid var(--line); padding:8px 10px; font-size:12.5px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .filters .count{margin-left:auto; font-size:12px; color:var(--ink-soft);}
  .filters .count b{color:var(--red);}
  .btn{
    appearance:none; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer;
    font-family:'Red Hat Text',sans-serif; font-weight:600; font-size:12.5px; padding:8px 14px;
  }
  .btn:hover{background:var(--red); border-color:var(--red);}
  .btn.ghost{background:#fff; color:var(--ink);}
  .btn.ghost:hover{background:var(--red-tint); color:var(--red); border-color:var(--red);}

  .callout{
    border-left:3px solid var(--amber); background:#FBF6EC; padding:12px 14px; font-size:12.5px; color:#5C4A22;
    margin-bottom:16px;
  }
  .callout.red{border-left-color:var(--red); background:var(--red-tint); color:var(--red-dark);}
  .callout b{font-weight:700;}

  .bar-track{background:#EFEEEA; height:8px; width:100%; position:relative; overflow:hidden;}
  .bar-fill{height:100%; background:var(--red);}

  .foot-note{margin-top:48px; padding-top:16px; border-top:1px solid var(--line); font-size:11px; color:var(--ink-soft); display:flex; justify-content:space-between;}

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(25,26,30,0.55); z-index:200;
    align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff; max-width:720px; width:100%; padding:0; box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-head{
    background:var(--ink); color:#fff; padding:18px 24px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:3px solid var(--red);
  }
  .modal-head h3{font-size:16px; font-weight:700;}
  .modal-head .sub{font-size:11.5px; color:#B9BBC4; margin-top:2px;}
  .modal-close{background:none; border:none; color:#fff; font-size:20px; cursor:pointer; line-height:1;}
  .modal-body{padding:22px 24px; max-height:70vh; overflow-y:auto;}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 24px;}
  .detail-grid .full{grid-column:1/-1;}
  .detail-item{border-bottom:1px dashed var(--line); padding:7px 0;}
  .detail-item .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700;}
  .detail-item .v{font-size:13.5px; margin-top:2px;}
  .detail-section-title{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--red); font-weight:700; margin:16px 0 4px; grid-column:1/-1;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-grid .full{grid-column:1/-1;}
  .form-field label{display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em;}
  .form-field input, .form-field select{width:100%; border:1px solid var(--line); padding:8px 10px; font-size:13px; font-family:inherit; background:#fff;}
  .modal-foot{padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#D8D5CC; border-radius:0;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width: 980px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .grid-2,.grid-3,.grid-2-1,.grid-1-2{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
    .detail-grid{grid-template-columns:1fr;}
  }
</style>
</head>

    display: (ctx) => { const t = ctx.chart.config.type; return t === 'bar' || t === 'doughnut' || t === 'pie'; },
    color: (ctx) => (ctx.chart.config.type === 'doughnut' || ctx.chart.config.type === 'pie') ? '#fff' : '#4A4C54',
    anchor: 'end',
    align: (ctx) => (ctx.chart.config.type === 'doughnut' || ctx.chart.config.type === 'pie') ? 'center' : 'end',
    offset: 2,
    clamp: true,
    font: { size: 9.5, weight: '700', family: "'Red Hat Text', sans-serif" },
    formatter: (value, ctx) => {
      if (value === null || value === undefined) return '';
      const chart = ctx.chart;
      const type = chart.config.type;
      const scales = chart.options.scales || {};
      const stacked = (scales.x && scales.x.stacked) || (scales.y && scales.y.stacked);
      let total = 0;
      if (type === 'doughnut' || type === 'pie') {
        total = ctx.dataset.data.reduce((a, b) => a + (b || 0), 0);
      } else if (stacked) {
        chart.data.datasets.forEach(d => { total += (d.data[ctx.dataIndex] || 0); });
      } else {
        total = ctx.dataset.data.reduce((a, b) => a + (b || 0), 0);
      }
      if (!total) return '';
      const pct = (value / total) * 100;
      if (pct < 5) return '';
      return Math.round(pct) + '%';
    }
  });
}

function fmtNum(n){ if(n===null||n===undefined) return '—'; return Math.round(n).toLocaleString('en-IN'); }
function fmtAED(n){ if(n===null||n===undefined) return '—'; return 'AED ' + Math.round(n).toLocaleString('en-US'); }
function fmtPct(n){ return n.toFixed(1)+'%'; }
function avg(arr){ const v = arr.filter(x=>x!==null&&x!==undefined&&!isNaN(x)); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; }
function sum(arr){ return arr.filter(x=>x!==null&&x!==undefined&&!isNaN(x)).reduce((a,b)=>a+b,0); }
function countBy(arr, fn){
  const m = new Map();
  arr.forEach(x=>{ const k = fn(x) ?? 'Unspecified'; m.set(k, (m.get(k)||0)+1); });
  return m;
}
function sortMapDesc(m){ return [...m.entries()].sort((a,b)=>b[1]-a[1]); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function daysBetween(d1,d2){ return (new Date(d2)-new Date(d1))/(1000*3600*24); }

function tenureYears(startDate, endDate){
  if(!startDate) return null;
  const s = new Date(startDate);
  const e = endDate ? new Date(endDate) : new Date('2026-07-12');
  return (e-s)/(1000*3600*24*365.25);
}

function parseD(s){
  if(!s) return null;
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function normAgency(c){
  c = (c||'').trim();
  if(/bim engineers/i.test(c)) return 'The BIM Engineers';
  if(/prompt/i.test(c)) return 'Prompt Engineering';
  if(/commandtech/i.test(c)) return 'Commandtech';
  if(/^contract$/i.test(c)) return 'Direct Contract';
  if(/intern/i.test(c)) return 'Intern';
  if(/beyond/i.test(c)) return 'Beyond Finance/Commercial';
  return c || 'Unspecified';
}

renderView.temp = function(){
  const root = document.getElementById('view-temp');

  const ended = TEMP.filter(x=>x.endDate);
  const byLoc = sortMapDesc(countBy(TEMP, x=>x.location));
  const byDept = sortMapDesc(countBy(TEMP, x=>x.department));
  const byDesig = sortMapDesc(countBy(TEMP, x=>x.designation)).slice(0,8);
  const byAgency = sortMapDesc(countBy(TEMP, x=>normAgency(x.company)));

  const durations = TEMP.map(x=>{
    const s = parseD(x.startDate), e = parseD(x.endDate);
    if(!s || !e) return null;
    return (e-s)/(1000*3600*24*30.44);
  }).filter(d=>d!=null && d>=0);
  const avgDuration = avg(durations);

  const agencies = [...new Set(TEMP.map(x=>normAgency(x.company)))];
  const agencyStats = agencies.map(a=>{
    const grp = TEMP.filter(x=>normAgency(x.company)===a);
    const durs = grp.map(x=>{ const s=parseD(x.startDate), e=parseD(x.endDate); return (s&&e)? (e-s)/(1000*3600*24*30.44) : null; }).filter(d=>d!=null);
    return {
      agency:a, headcount:grp.length, activeCount:grp.filter(x=>!x.endDate).length,
      monthlyCost: sum(grp.map(x=>x.monthlyCost)), avgCost: avg(grp.map(x=>x.monthlyCost)),

  basic:'Basic (AED)', accommodation:'Accommodation (AED)', transport:'Transport (AED)', flight:'Flight Allowance (AED)',
  bonusPct:'Bonus %', contractSalary:'Contract Salary (AED)', lastIncreaseDate:'Last Increase Date',
  salaryCutPct:'Salary Cut %', effectiveSalary:'Effective Salary (AED)', marginCost:'Margin Cost (AED)',
  amortisedSoftware:'Amortised Software Cost (AED)', totalCostToAccess:'Total Cost to Access (AED)', notes:'Notes',
};
const SECTION_MAP = {
  'Profile': ['name','payroll','location','dept','role','deptRole','jobTitle','grading','gender','nationality','startDate','age','contractType','visaType','lineManager'],
  'Tenure & Experience': ['yearsIn9E','totalExp','lastIncreaseDate'],

  'Salary & Cost': ['salary','salaryAED','salaryOfferINR','basic','accommodation','transport','flight','bonusPct','contractSalary','salaryCutPct','effectiveSalary','marginCost','amortisedSoftware','totalCostToAccess'],
  'Notes': ['notes'],
};
function fmtVal(k,v){
  if(v===null||v===undefined||v==='') return '—';
  if(/salary|cost|^basic$|accommodation|transport|flight/i.test(k) && typeof v==='number') return fmtAED(v);
  if((k==='salaryCutPct'||k==='bonusPct') && typeof v==='number') return (v<=1? (v*100):v).toFixed(0)+'%';
  if((k==='yearsIn9E'||k==='totalExp') && typeof v==='number') return v.toFixed(1)+' yrs';
  return v;
}
function openEmpDetail(emp){
  document.getElementById('empDetailName').textContent = emp.name || 'Employee';
  document.getElementById('empDetailSub').textContent = [emp.jobTitle, emp.dept, emp.location==='Dubai'?'Dubai':(emp.location||'India')].filter(Boolean).join(' · ');
  const grid = document.getElementById('empDetailGrid');
  let html = '';
  Object.entries(SECTION_MAP).forEach(([section, keys])=>{

    html += `<div class="detail-section-title">${section}</div>`;

      html += `<div class="detail-item"><div class="k">${FIELD_LABELS[k]||k}</div><div class="v">${fmtVal(k, emp[k])}</div></div>`;

  document.getElementById('empDetailOverlay').classList.add('open');
}

  const salaryVal = fd.get('salary') ? +fd.get('salary') : null;
  const startDate = fd.get('startDate') || null;
  const tenure = startDate ? +(((new Date())-new Date(startDate))/(1000*3600*24*365.25)).toFixed(1) : null;

  const emp = {
    office, name: fd.get('name'), payroll: fd.get('payroll') || ('EMP-'+Date.now()),

    gender: fd.get('gender')||null, nationality: fd.get('nationality')||null,
    age: fd.get('age')? +fd.get('age') : null, startDate, yearsIn9E: tenure,
    contractType: fd.get('contractType')||'Permanent',
    degree: fd.get('degreeField')||null, university: fd.get('universityField')||null,

  [...new Set(ALL_PERM.map(x=>x.dept).filter(Boolean))].sort().forEach(d=>deptSel.appendChild(el(`<option value="${d}">${d}</option>`)));

  let sortKey = 'name', sortDir = 1, currentRows = [];

    const q = document.getElementById('dir-search').value.toLowerCase();

      return true;

    rows = rows.slice().sort((a,b)=>{
      let av=a[sortKey], bv=b[sortKey];
      if(av==null) av = typeof bv==='number' ? -Infinity : '';
      if(bv==null) bv = typeof av==='number' ? -Infinity : '';
      if(typeof av==='string') return av.localeCompare(bv)*sortDir;
      return (av-bv)*sortDir;

      <td class="mono">${x.startDate||'—'}</td>
    </tr>`).join('');
    document.querySelectorAll('#dir-table tbody tr').forEach(tr=>{
      tr.addEventListener('click', ()=> openEmpDetail(currentRows[+tr.dataset.idx]));
    });
  }

  document.querySelectorAll('#dir-table th[data-k]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.k;
      if(sortKey===k) sortDir *= -1; else { sortKey=k; sortDir=1; }
      renderTable();
    });
  });
  ['dir-search','dir-loc-filter','dir-dept-filter','dir-gender-filter'].forEach(id=>{
    const evt = id==='dir-search' ? 'input' : 'change';
    document.getElementById(id).addEventListener(evt, renderTable);
  });
  renderTable();
};

function exportToExcel(){
  if(!window.XLSX){ alert('XLSX library failed to load — check your internet connection.'); return; }
  const wb = XLSX.utils.book_new();
  const addSheet = (name, arr)=>{
    if(!arr || !arr.length) return;
    const ws = XLSX.utils.json_to_sheet(arr);
    XLSX.utils.book_append_sheet(wb, ws, name.substring(0,31));
  };
  addSheet('Dubai', DUBAI);
  addSheet('India', INDIA);
  addSheet('Temp Staff', TEMP);
  addSheet('Resigned-Terminated', RESIGNED);
  addSheet('Dubai Cost by Dept', COST_PROJ.dubai);
  addSheet('India Cost by Dept', COST_PROJ.india);
  addSheet('Combined Cost by Dept', COST_PROJ.combined);
  addSheet('Salary Reduction', SAL_RED);
  XLSX.writeFile(wb, '9E_Workforce_Backup_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
document.getElementById('btnExportExcel').addEventListener('click', exportToExcel);

function buildBoardPPT(){
  if(!window.PptxGenJS){ alert('pptxgenjs library failed to load — check your internet connection.'); return; }
  ['overview','cost','attrition'].forEach(v=>{ if(!rendered[v]){ renderView[v](); rendered[v]=true; } });
  setTimeout(()=>{
    const pptx = new PptxGenJS();
    pptx.defineLayout({name:'WIDE', width:13.33, height:7.5});
    pptx.layout = 'WIDE';
    const RED='D6242F', INK='191A1E', SOFT='4A4C54', PAPER='F6F4F1', LINE='E4E1DA';

    let s = pptx.addSlide();
    s.background = { color: INK };
    s.addShape(pptx.ShapeType.rect, {x:0,y:0,w:13.33,h:0.12,fill:{color:RED}});
    s.addText('9E Global — Workforce Intelligence', {x:0.6,y:2.8,w:12,h:1,fontSize:32,bold:true,color:'FFFFFF'});
    s.addText('Board Summary · Generated '+new Date().toLocaleDateString(), {x:0.6,y:3.7,w:12,h:0.5,fontSize:14,color:'B9BBC4'});

    const total = DUBAI.length + INDIA.length;
    const male = ALL_PERM.filter(x=>x.gender==='Male').length;
    const female = ALL_PERM.filter(x=>x.gender==='Female').length;
    const tempCost = sum(TEMP.map(x=>x.monthlyCost));
    const resignedN = RESIGNED.filter(x=>x.exitType==='Resigned').length;
    const terminatedN = RESIGNED.filter(x=>x.exitType==='Terminated').length;
    const kpis = [
      ['Total Headcount', total, DUBAI.length+' Dubai · '+INDIA.length+' India'],
      ['Gender Split', male+':'+female, (total?(female/total*100).toFixed(0):0)+'% female'],
      ['Temp Workforce', TEMP.length, fmtAED(tempCost)+'/mo'],
      ['Monthly Payroll', fmtAED(COST_PROJ.combinedTotal.monthlyBase), 'Permanent + temp'],
      ['Exits Logged', RESIGNED.length, 'India + Dubai'],
      ['Resigned vs Terminated', resignedN+':'+terminatedN, 'Of '+RESIGNED.length+' logged exits'],
    ];
    s = pptx.addSlide();
    s.addText('Firm-wide Snapshot', {x:0.5,y:0.35,w:12,h:0.6,fontSize:22,bold:true,color:INK});
    kpis.forEach((k,i)=>{
      const x = 0.5 + (i%3)*4.2, y = 1.3 + Math.floor(i/3)*2.1;
      s.addShape(pptx.ShapeType.rect, {x,y,w:3.9,h:1.85,fill:{color:PAPER},line:{color:LINE,width:1}});
      s.addText(String(k[0]).toUpperCase(), {x:x+0.2,y:y+0.15,w:3.5,h:0.3,fontSize:10,bold:true,color:SOFT});
      s.addText(String(k[1]), {x:x+0.2,y:y+0.5,w:3.5,h:0.75,fontSize:26,bold:true,color:INK});
      s.addText(String(k[2]), {x:x+0.2,y:y+1.25,w:3.5,h:0.5,fontSize:10,color:SOFT});
    });

    const chartSlides = [
      ['ov-dept-office','Headcount by Department & Office'],
      ['cost-dxb-dept','Dubai — Payroll by Department'],
      ['cost-ind-dept','India — Payroll by Department'],
      ['attr-dept','Exits by Department'],
      ['attr-exittype','Resignations vs Terminations'],
    ];
    chartSlides.forEach(([id,title])=>{
      const canvas = document.getElementById(id);
      if(!canvas) return;
      const img = canvas.toDataURL('image/png',1.0);
      const s2 = pptx.addSlide();
      s2.addText(title, {x:0.5,y:0.35,w:12,h:0.6,fontSize:20,bold:true,color:INK});
      s2.addImage({data:img, x:1.6, y:1.2, w:10.1, h:5.6});
    });

    pptx.writeFile({fileName:'9E_Board_Summary_'+new Date().toISOString().slice(0,10)+'.pptx'});
  }, 450);
}
document.getElementById('btnExportPPT').addEventListener('click', buildBoardPPT);

// ============================= INIT =============================
renderView.overview();
rendered.overview = true;
</script>
