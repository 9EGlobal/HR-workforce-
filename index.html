<style>
  /* ============= 9E GLOBAL DESIGN TOKENS (from DESIGN.md) ============= */
  :root{
    --red:#D6242F; --red-deep:#9A1921; --red-hover:#B91D26; --red-light:#E76872; --red-tint:#F5E4E6;
    --ink:#4A4A4E; --warm-ink:#5A5A5E;
    --surface:#FFFFFF; --surface-variant:#F5F5F5;
    --n800:#3A3A3A; --n600:#7E7E7E; --n400:#BFBFBF; --n200:#E8E8E8; --n100:#F5F5F5;
    --outline:#E0E0E0;
    --success:#2D7A4F; --warning:#7A5500; --danger:#9A1921; --info:#3A5A6E;
    --r-sm:4px; --r-md:8px; --r-lg:12px; --r-pill:999px;
    --shadow-1:0 1px 3px rgba(17,17,17,0.08);
    --shadow-2:0 8px 24px rgba(17,17,17,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--surface); color:var(--ink); font-family:'Red Hat Display',Arial,sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Red Hat Display',Arial,sans-serif; letter-spacing:-0.005em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .eyebrow{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:var(--red);}

  /* ============= App shell ============= */
  .topbar{
    background:var(--ink); color:#fff; padding:0 28px;
    display:flex; align-items:center; justify-content:space-between;
    height:64px; position:sticky; top:0; z-index:50;
    border-bottom:4px solid var(--red);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:34px;height:34px; background:var(--red); display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:18px; color:#fff;
  }
  .brand-text{line-height:1.15;}
  .brand-text .t1{font-weight:700; font-size:15px;}
  .brand-text .t2{font-size:11px; color:var(--n400); text-transform:uppercase; letter-spacing:.08em;}
  .topbar-right{display:flex; align-items:center; gap:12px; font-size:12px; color:var(--n400);}
  .topbar-right .dot{width:6px;height:6px;background:var(--success);border-radius:50%;display:inline-block;margin-right:6px;}

  .btn{
    appearance:none; border:none; cursor:pointer; font-family:inherit;
    font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    border-radius:var(--r-sm); padding:11px 16px; transition:background .15s, color .15s, border-color .15s;
  }
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{background:var(--red-hover);}
  .btn-primary:active{background:var(--red-deep);}
  .btn-secondary{background:var(--surface); color:var(--ink); border:1px solid var(--outline);}
  .btn-secondary:hover{background:var(--n100);}
  .btn-ghost{background:var(--red-tint); color:var(--red-deep);}
  .btn-ghost:hover{background:#efd3d6;}
  .btn-dark{background:var(--ink); color:#fff; border:1px solid var(--n800);}
  .btn-dark:hover{background:var(--red); border-color:var(--red);}
  .btn-row{display:flex; gap:8px;}

  .nav{
    background:var(--surface); border-bottom:1px solid var(--outline);
    display:flex; gap:2px; padding:0 24px; overflow-x:auto; position:sticky; top:64px; z-index:40;
  }
  .nav button{
    appearance:none; border:none; background:none; cursor:pointer; font-family:inherit;
    font-weight:600; font-size:13.5px; color:var(--n600);
    padding:16px 16px 13px; border-bottom:3px solid transparent; white-space:nowrap;
    transition:color .15s;
  }
  .nav button:hover{color:var(--ink);}
  .nav button.active{color:var(--red); border-bottom-color:var(--red);}

  main{max-width:1620px; margin:0 auto; padding:28px 20px 80px;}
  .view{display:none;}
  .view.active{display:block; animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .section-title{display:flex; align-items:baseline; justify-content:space-between; margin:36px 0 14px; gap:16px; flex-wrap:wrap;}
  .section-title h2{font-size:19px; font-weight:700;}
  .section-title .sub{font-size:12.5px; color:var(--n600);}
  .section-title:first-child{margin-top:0;}

  /* ============= KPI cards ============= */
  .kpi-row{display:grid; grid-template-columns:repeat(6,1fr); gap:12px;}
  .kpi{background:var(--surface); border-radius:var(--r-md); box-shadow:var(--shadow-1); padding:16px;}
  .kpi .label{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--red);}
  .kpi .value{font-size:27px; font-weight:700; margin-top:8px; line-height:1.1;}
  .kpi .foot{font-size:11.5px; color:var(--n600); margin-top:6px;}
  .kpi .foot b{color:var(--ink);}

  /* ============= Grid / cards ============= */
  .grid{display:grid; gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  .grid-2-1{grid-template-columns:2fr 1fr;}
  .grid-1-2{grid-template-columns:1fr 2fr;}
  .grid-1{grid-template-columns:1fr;}
  .card{background:var(--surface); border-radius:var(--r-md); box-shadow:var(--shadow-1); padding:18px 20px;}
  .card h3{font-size:13.5px; font-weight:700; margin-bottom:2px;}
  .card .card-sub{font-size:11.5px; color:var(--n600); margin-bottom:14px;}
  .chart-wrap{position:relative; height:260px;}
  .chart-wrap.short{height:200px;}
  .chart-wrap.tall{height:340px;}

  .legend-list{list-style:none; margin-top:10px; font-size:12.5px;}
  .legend-list li{display:flex; align-items:center; justify-content:space-between; padding:5px 0; border-bottom:1px dashed var(--outline);}
  .legend-list li:last-child{border-bottom:none;}
  .legend-list .sw{width:10px;height:10px; display:inline-block; margin-right:8px; flex:none; border-radius:2px;}
  .legend-list .name{display:flex; align-items:center; color:var(--n600);}
  .legend-list .val{font-weight:700; font-family:'JetBrains Mono',monospace; font-size:12px;}

  /* ============= Tables ============= */
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{
    text-align:left; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
    color:var(--red); padding:10px 10px; border-bottom:2px solid var(--ink);
    position:sticky; top:0; background:var(--surface); cursor:pointer; user-select:none;
  }
  th:hover{color:var(--red-deep); background:var(--n100);}
  td{padding:9px 10px; border-bottom:1px solid var(--outline); color:var(--ink);}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:var(--n100);}
  .tbl-wrap{max-height:540px; overflow:auto; border:1px solid var(--outline); border-radius:var(--r-md);}
  .pill{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:var(--r-pill); text-transform:uppercase; letter-spacing:.03em;}
  .pill.m{background:var(--n100); color:var(--ink);}
  .pill.f{background:var(--n200); color:var(--ink);}
  .pill.dept{background:var(--n100); color:var(--n600); border-radius:var(--r-sm);}
  .pill.active{background:var(--success); color:#fff;}
  .pill.inactive{background:var(--n200); color:var(--n600);}
  .pill.resigned{background:var(--info); color:#fff;}
  .pill.terminated{background:var(--danger); color:#fff;}
  .pill.unclassified{background:var(--warning); color:#fff;}

  /* ============= Filters / forms ============= */
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
  .filters input[type=text]{border:1px solid var(--outline); border-radius:var(--r-sm); padding:9px 12px; font-size:12.5px; font-family:inherit; min-width:220px; background:#fff;}
  .filters select{border:1px solid var(--outline); border-radius:var(--r-sm); padding:9px 10px; font-size:12.5px; font-family:inherit; background:#fff; color:var(--ink);}
  .filters .count{margin-left:auto; font-size:12px; color:var(--n600);}
  .filters .count b{color:var(--red);}
  .bulk-actions{display:none; align-items:center; gap:8px;}
  .bulk-actions.show{display:flex;}
  .bulk-actions .count{font-size:12px; color:var(--n600); margin-right:2px;}
  td.chk, th.chk{width:32px; text-align:center; padding-left:14px;}
  input[type=checkbox]{width:15px; height:15px; accent-color:var(--red); cursor:pointer;}

  .seg{display:inline-flex; border:1px solid var(--outline); border-radius:var(--r-sm); overflow:hidden;}
  .seg button{appearance:none; border:none; background:#fff; color:var(--n600); font-family:inherit; font-weight:600; font-size:12.5px; padding:9px 18px; cursor:pointer; border-right:1px solid var(--outline);}
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--ink); color:#fff;}

  .callout{border-left:3px solid var(--warning); background:#FBF6EC; padding:12px 14px; border-radius:0 var(--r-sm) var(--r-sm) 0; font-size:12.5px; color:#5C4A22; margin-bottom:16px;}
  .callout.red{border-left-color:var(--red); background:var(--red-tint); color:var(--red-deep);}
  .callout.info{border-left-color:var(--info); background:#EBF0F3; color:var(--info);}
  .callout b{font-weight:700;}

  .bar-track{background:var(--n200); height:8px; width:100%; border-radius:var(--r-pill); overflow:hidden;}
  .bar-fill{height:100%; background:var(--red);}

  .foot-note{margin-top:48px; padding-top:16px; border-top:1px solid var(--outline); font-size:11px; color:var(--n600); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

  /* ============= Modals ============= */
  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(17,17,17,0.55); z-index:200; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff; max-width:760px; width:100%; border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow-2);}
  .modal-head{background:var(--ink); color:#fff; padding:18px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:3px solid var(--red);}
  .modal-head h3{font-size:16px; font-weight:700;}
  .modal-head .sub{font-size:11.5px; color:var(--n400); margin-top:2px;}
  .modal-close{background:none; border:none; color:#fff; font-size:20px; cursor:pointer; line-height:1;}
  .modal-body{padding:22px 24px; max-height:70vh; overflow-y:auto;}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 24px;}
  .detail-grid .full{grid-column:1/-1;}
  .detail-item{border-bottom:1px dashed var(--outline); padding:7px 0;}
  .detail-item .k{font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--n600);}
  .detail-item .v{font-size:13.5px; margin-top:2px;}
  .detail-section-title{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--red); margin:16px 0 4px; grid-column:1/-1;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-grid .full{grid-column:1/-1;}
  .form-field label{display:block; font-size:11px; font-weight:600; color:var(--n600); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em;}
  .form-field input, .form-field select{width:100%; border:1px solid var(--outline); border-radius:var(--r-sm); padding:9px 10px; font-size:13px; font-family:inherit; background:#fff;}
  .modal-foot{padding:16px 24px; border-top:1px solid var(--outline); display:flex; justify-content:flex-end; gap:8px;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--n400); border-radius:0;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width: 980px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .grid-2,.grid-3,.grid-2-1,.grid-1-2{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
    .detail-grid{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
// ============================= DATA =============================
const DATA = JSON.parse(document.getElementById('data-blob').textContent);
const DUBAI = DATA.dubai;

const TEMP = DATA.tempStaff;

const COST_PROJ = DATA.costProjection;
const SAL_RED = DATA.salaryReduction;
let ALL_PERM = DUBAI.map(d=>({...d, location:'Dubai', office:'Dubai', currency:'AED'}))
  .concat(INDIA.map(d=>({...d, location:d.location||'India', office:'India', currency:'AED'})));

function fmtSourceDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
document.getElementById('genTime').textContent = 'Data as of ' + fmtSourceDate(DATA.generatedOn);
document.getElementById('liveFromLabel').textContent = 'Live from ' + (DATA.sourceFile || 'mastersheet');
document.getElementById('sourceFileLabel').textContent = 'Source: ' + (DATA.sourceFile ? DATA.sourceFile + '.xlsx' : 'mastersheet.xlsx');

function esc(s){
  if(s===null || s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function mkChart(id, config){
  const canvas = document.getElementById(id);
  if(!canvas) return null;
  const existing = Chart.getChart(canvas);
  if(existing) existing.destroy();
  return new Chart(canvas, config);
}

// ============================= CHART DEFAULTS (9E brand) =============================
Chart.defaults.font.family = "'Red Hat Display', Arial, sans-serif";
Chart.defaults.font.size = 11.5;
Chart.defaults.color = '#7E7E7E';
Chart.defaults.animation = false; // reliable PPT/PNG capture, snappier UI
Chart.defaults.plugins.legend.labels.usePointStyle = true;
Chart.defaults.plugins.legend.labels.boxWidth = 8;
Chart.defaults.plugins.legend.labels.boxHeight = 8;
Chart.defaults.plugins.tooltip.backgroundColor = '#4A4A4E';
Chart.defaults.plugins.tooltip.padding = 10;
Chart.defaults.plugins.tooltip.titleFont = { family: "'Red Hat Display', Arial, sans-serif", weight: 700 };
Chart.defaults.plugins.tooltip.cornerRadius = 4;
Chart.defaults.plugins.tooltip.displayColors = true;
Chart.defaults.plugins.tooltip.boxPadding = 4;

if (window.ChartDataLabels) {
  Chart.register(ChartDataLabels);

  function hexToRgb(hex){
    if(!hex || typeof hex !== 'string') return {r:255,g:255,b:255};
    let h = hex.replace('#','');
    if(h.length===3) h = h.split('').map(c=>c+c).join('');
    const num = parseInt(h,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function contrastColor(hex){
    const {r,g,b} = hexToRgb(hex);
    const lum = (0.299*r + 0.587*g + 0.114*b)/255;
    return lum > 0.6 ? '#111111' : '#FFFFFF';
  }
  function sliceColor(ctx){
    const bg = ctx.dataset.backgroundColor;
    return Array.isArray(bg) ? bg[ctx.dataIndex] : bg;
  }

  Chart.defaults.set('plugins.datalabels', {
    display: (ctx) => { const t = ctx.chart.config.type; return t === 'bar' || t === 'doughnut' || t === 'pie'; },
    color: (ctx) => {
      const type = ctx.chart.config.type;
      if (type === 'doughnut' || type === 'pie') return contrastColor(sliceColor(ctx));
      return '#111111';
    },
    textStrokeColor: (ctx) => {
      const type = ctx.chart.config.type;
      if (type === 'doughnut' || type === 'pie') return contrastColor(sliceColor(ctx)) === '#FFFFFF' ? 'rgba(17,17,17,0.55)' : 'rgba(255,255,255,0.95)';
      return 'rgba(255,255,255,0.95)';
    },
    textStrokeWidth: 3,
    anchor: 'end',
    align: (ctx) => (ctx.chart.config.type === 'doughnut' || ctx.chart.config.type === 'pie') ? 'center' : 'end',
    offset: 3, clamp: true,
    font: { size: 10.5, weight: '800', family: "'Red Hat Display', Arial, sans-serif" },
    formatter: (value, ctx) => {
      if (value === null || value === undefined) return '';
      const chart = ctx.chart, type = chart.config.type;
      const scales = chart.options.scales || {};
      const stacked = (scales.x && scales.x.stacked) || (scales.y && scales.y.stacked);
      let total = 0;
      if (type === 'doughnut' || type === 'pie') total = ctx.dataset.data.reduce((a,b)=>a+(b||0),0);
      else if (stacked) chart.data.datasets.forEach(d=>{ total += (d.data[ctx.dataIndex]||0); });
      else total = ctx.dataset.data.reduce((a,b)=>a+(b||0),0);
      if (!total) return '';
      const pct = (value/total)*100;
      if (pct < 4) return '';
      return Math.round(pct) + '%';
    }
  });
}

};

function fmtNum(n){ if(n===null||n===undefined) return '—'; return Math.round(n).toLocaleString('en-IN'); }
function fmtAED(n){ if(n===null||n===undefined) return '—'; return 'AED ' + Math.round(n).toLocaleString('en-US'); }
function fmtPct(n){ return n.toFixed(1)+'%'; }
function avg(arr){ const v = arr.filter(x=>x!==null&&x!==undefined&&!isNaN(x)); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; }
function sum(arr){ return arr.filter(x=>x!==null&&x!==undefined&&!isNaN(x)).reduce((a,b)=>a+b,0); }
function countBy(arr, fn){ const m = new Map(); arr.forEach(x=>{ const k = fn(x) ?? 'Unspecified'; m.set(k, (m.get(k)||0)+1); }); return m; }
function sortMapDesc(m){ return [...m.entries()].sort((a,b)=>b[1]-a[1]); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function daysBetween(d1,d2){ return (new Date(d2)-new Date(d1))/(1000*3600*24); }
function tenureYears(startDate, endDate){
  if(!startDate) return null;
  const s = new Date(startDate);
  const e = endDate ? new Date(endDate) : new Date();
  return (e-s)/(1000*3600*24*365.25);
}
const TODAY_STR = new Date().toISOString().slice(0,10);

function trueCostDXB(x){ return x.effectiveSalary!=null ? x.effectiveSalary : x.salary; }
function trueCostIND(x){ return x.totalCostToAccess!=null ? x.totalCostToAccess : x.salaryAED; }
function trueCost(x){ return x.office==='Dubai' ? trueCostDXB(x) : trueCostIND(x); }

// ============================= LOCAL PERSISTENCE =============================
const LS_EXIT_KEY = '9e_exit_types';
const LS_EMP_KEY = '9e_custom_employees';
function exitKey(x){ return (x.name||'')+'|'+(x.startDate||'')+'|'+(x.payroll||''); }
function loadExitTypeOverrides(){ try{ return JSON.parse(localStorage.getItem(LS_EXIT_KEY)||'{}'); }catch(e){ return {}; } }
function saveExitTypeOverride(key,type){ const store=loadExitTypeOverrides(); store[key]=type; localStorage.setItem(LS_EXIT_KEY, JSON.stringify(store)); }
function applyExitTypes(){ const store=loadExitTypeOverrides(); RESIGNED.forEach(x=>{ x.exitType = store[exitKey(x)] || x.exitType || 'Unclassified'; }); }
applyExitTypes();

function loadCustomEmployees(){
  try{
    const raw = localStorage.getItem(LS_EMP_KEY);
    if(!raw) return;
    const arr = JSON.parse(raw);
    arr.forEach(emp=>{ if(emp.office==='Dubai'){ DUBAI.push(emp); } else { INDIA.push(emp); } });
  }catch(e){ console.error('Could not load saved employees', e); }
}
function saveCustomEmployee(emp){
  const raw = localStorage.getItem(LS_EMP_KEY);
  const arr = raw ? JSON.parse(raw) : [];
  arr.push(emp);
  localStorage.setItem(LS_EMP_KEY, JSON.stringify(arr));
}
function rebuildAllPerm(){
  ALL_PERM = DUBAI.map(d=>({...d, location:'Dubai', office:'Dubai', currency:'AED'}))
    .concat(INDIA.map(d=>({...d, location:d.location||'India', office:'India', currency:'AED'})));
}
loadCustomEmployees();
rebuildAllPerm();

      <div class="kpi"><div class="label">Nationalities (Dubai)</div><div class="value">${new Set(DUBAI.map(x=>x.nationality).filter(Boolean)).size}</div><div class="foot">Dubai office diversity</div></div>
    </div>

    <div class="section-title"><h2>Where the firm sits today</h2><div class="sub">Headcount by office, gender split, and department mix</div></div>
    <div class="grid grid-2-1">
      <div class="card">

  });

  const ageBands = ['20-24','25-29','30-34','35-39','40-44','45-49','50-54','55+'];
  function ageBand(a){ if(a==null) return null; if(a<25) return '20-24'; if(a<30) return '25-29'; if(a<35) return '30-34'; if(a<40) return '35-39'; if(a<45) return '40-44'; if(a<50) return '45-49'; if(a<55) return '50-54'; return '55+'; }
  const ageCounts = countBy(ALL_PERM.filter(x=>x.age!=null), x=>ageBand(x.age));
  mkChart('ov-age', {
    type:'bar', data:{ labels:ageBands, datasets:[{ data:ageBands.map(b=>ageCounts.get(b)||0), backgroundColor:C.warning }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{grid:{color:C.outline}}, x:{grid:{display:false}} } }
  });

  const tenureBands = ['<1y','1-2y','2-3y','3-5y','5y+'];
  function tBand(t){ if(t==null) return null; if(t<1) return '<1y'; if(t<2) return '1-2y'; if(t<3) return '2-3y'; if(t<5) return '3-5y'; return '5y+'; }
  const tenureCounts = countBy(ALL_PERM.filter(x=>x.yearsIn9E!=null), x=>tBand(x.yearsIn9E));
  mkChart('ov-tenure', {
    type:'bar', data:{ labels:tenureBands, datasets:[{ data:tenureBands.map(b=>tenureCounts.get(b)||0), backgroundColor:C.info }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{grid:{color:C.outline}}, x:{grid:{display:false}} } }
  });

  function seniorityBucket(role){
    if(!role) return 'Other'; const r = role.toLowerCase();
    if(r.includes('director')) return 'Director+';
    if(r.includes('principal')) return 'Principal';
    if(r.includes('lead') || r.includes('associate')) return 'Lead/Associate';
    if(r.includes('senior')) return 'Senior';
    if(r.includes('engineer') || r.includes('architect') || r.includes('bim') || r.includes('inspector')) return 'Engineer';
    return 'Support/Admin';
  }
  window.seniorityBucket2 = seniorityBucket;
  const senOrder = ['Director+','Principal','Lead/Associate','Senior','Engineer','Support/Admin'];
  const senCounts = countBy(ALL_PERM, x=>seniorityBucket(x.role));
  mkChart('ov-role', {
    type:'bar', data:{ labels:senOrder, datasets:[{ data:senOrder.map(b=>senCounts.get(b)||0), backgroundColor:C.ink }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{color:C.outline}}, y:{grid:{display:false}} } }
  });

  const cityCounts = sortMapDesc(countBy(INDIA, x=>x.location));
  mkChart('ov-india-city', {
    type:'bar', data:{ labels:cityCounts.map(c=>c[0]), datasets:[{ data:cityCounts.map(c=>c[1]), backgroundColor:C.red }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{color:C.outline}}, y:{grid:{display:false}} } }
  });

  const natCounts = sortMapDesc(countBy(DUBAI, x=>x.nationality)).slice(0,8);
  mkChart('ov-nationality', {
    type:'bar', data:{ labels:natCounts.map(c=>c[0]), datasets:[{ data:natCounts.map(c=>c[1]), backgroundColor:C.palette }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{color:C.outline}}, y:{grid:{display:false}} } }
  });
};

// ============================= INDIA / DUBAI LOCATION VIEWS =============================
function buildLocationView(containerId, opts){
  const { staff, title, subtitle, accent, costFn, showNationality, showCity } = opts;
  const root = document.getElementById(containerId);
  const male = staff.filter(x=>x.gender==='Male').length;
  const female = staff.filter(x=>x.gender==='Female').length;
  const avgAge = avg(staff.map(x=>x.age));
  const avgTenure = avg(staff.map(x=>x.yearsIn9E));
  const avgSalary = avg(staff.map(costFn));
  const deptCounts = sortMapDesc(countBy(staff, x=>x.dept));

  root.innerHTML = `
    <div class="section-title"><h2>${title}</h2><div class="sub">${subtitle}</div></div>
    <div class="kpi-row">
      <div class="kpi"><div class="label">Headcount</div><div class="value">${staff.length}</div><div class="foot">Permanent staff</div></div>
      <div class="kpi"><div class="label">Gender Split</div><div class="value">${male}:${female}</div><div class="foot"><b>${fmtPct(female/staff.length*100)}</b> female</div></div>
      <div class="kpi"><div class="label">Avg. Age</div><div class="value">${avgAge?avgAge.toFixed(1):'—'}</div><div class="foot">years</div></div>
      <div class="kpi"><div class="label">Avg. Tenure</div><div class="value">${avgTenure?avgTenure.toFixed(1):'—'}y</div><div class="foot">since joining 9E</div></div>
      <div class="kpi"><div class="label">Avg. Monthly Cost</div><div class="value" style="font-size:21px;">${avgSalary?fmtAED(avgSalary):'—'}</div><div class="foot">per head, AED equiv.</div></div>
    </div>

    <div class="grid grid-2-1" style="margin-top:24px;">
      <div class="card"><h3>Department Composition</h3><div class="card-sub">Headcount &amp; gender split by department</div><div class="chart-wrap tall"><canvas id="${containerId}-dept"></canvas></div></div>
      <div class="card"><h3>Gender by Department</h3><div class="card-sub">Where the ratio skews most</div><div id="${containerId}-gender-list"></div></div>
    </div>

    <div class="grid grid-3" style="margin-top:16px;">
      <div class="card"><h3>Seniority Pyramid</h3><div class="card-sub">Role banding</div><div class="chart-wrap short"><canvas id="${containerId}-role"></canvas></div></div>
      <div class="card"><h3>Tenure Bands</h3><div class="card-sub">Years at 9E</div><div class="chart-wrap short"><canvas id="${containerId}-tenure"></canvas></div></div>
      <div class="card"><h3>${showNationality?'Nationality Mix':(showCity?'City Split':'Age Bands')}</h3><div class="card-sub">${showNationality?'Top nationalities':(showCity?'Regional distribution':'5-year age bands')}</div><div class="chart-wrap short"><canvas id="${containerId}-extra"></canvas></div></div>
    </div>

    <div class="grid grid-1" style="margin-top:16px;">
      <div class="card"><h3>Monthly Cost Distribution</h3><div class="card-sub">Salary bands, AED equivalent per head</div><div class="chart-wrap short"><canvas id="${containerId}-salary"></canvas></div></div>
    </div>
  `;

  const deptOrder = deptCounts.map(d=>d[0]);
  const mByDept = deptOrder.map(d=>staff.filter(x=>x.dept===d && x.gender==='Male').length);
  const fByDept = deptOrder.map(d=>staff.filter(x=>x.dept===d && x.gender==='Female').length);
  mkChart(containerId+'-dept', {
    type:'bar', data:{ labels:deptOrder, datasets:[{label:'Male', data:mByDept, backgroundColor:C.ink},{label:'Female', data:fByDept, backgroundColor:C.red}] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, scales:{ x:{stacked:true, grid:{color:C.outline}}, y:{stacked:true, grid:{display:false}} }, plugins:{ legend:{position:'top', align:'end'} } }
  });

  const glist = document.getElementById(containerId+'-gender-list');
  glist.innerHTML = '<ul class="legend-list">' + deptOrder.map(d=>{
    const tot = mByDept[deptOrder.indexOf(d)] + fByDept[deptOrder.indexOf(d)];
    const fpct = tot? (fByDept[deptOrder.indexOf(d)]/tot*100) : 0;
    return `<li><span class="name">${d} <span class="mono" style="color:${C.n400};margin-left:4px;">(${tot})</span></span>
      <span style="display:flex;align-items:center;gap:8px;"><span class="bar-track" style="width:80px;"><span class="bar-fill" style="width:${fpct}%;"></span></span><span class="val">${fpct.toFixed(0)}% F</span></span></li>`;
  }).join('') + '</ul>';

  const senOrder = ['Director+','Principal','Lead/Associate','Senior','Engineer','Support/Admin'];
  const senCounts = countBy(staff, x=>seniorityBucket2(x.role));
  mkChart(containerId+'-role', {
    type:'bar', data:{ labels:senOrder, datasets:[{ data:senOrder.map(b=>senCounts.get(b)||0), backgroundColor:accent }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{color:C.outline}}, y:{grid:{display:false}} } }
  });

  const tenureBands = ['<1y','1-2y','2-3y','3-5y','5y+'];
  function tBand(t){ if(t==null) return null; if(t<1) return '<1y'; if(t<2) return '1-2y'; if(t<3) return '2-3y'; if(t<5) return '3-5y'; return '5y+'; }
  const tenureCounts = countBy(staff.filter(x=>x.yearsIn9E!=null), x=>tBand(x.yearsIn9E));
  mkChart(containerId+'-tenure', {
    type:'doughnut', data:{ labels:tenureBands, datasets:[{ data:tenureBands.map(b=>tenureCounts.get(b)||0), backgroundColor:C.palette, borderWidth:2, borderColor:'#fff' }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'60%', plugins:{legend:{position:'bottom', labels:{boxWidth:8,boxHeight:8,padding:8,font:{size:10.5}}}} }
  });

  if(showNationality){
    const nat = sortMapDesc(countBy(staff, x=>x.nationality)).slice(0,8);
    mkChart(containerId+'-extra', { type:'bar', data:{ labels:nat.map(n=>n[0]), datasets:[{data:nat.map(n=>n[1]), backgroundColor:C.palette}] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{color:C.outline}}, y:{grid:{display:false}} } } });
  } else if(showCity){
    const city = sortMapDesc(countBy(staff, x=>x.location));
    mkChart(containerId+'-extra', { type:'bar', data:{ labels:city.map(n=>n[0]), datasets:[{data:city.map(n=>n[1]), backgroundColor:C.palette}] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{color:C.outline}}, y:{grid:{display:false}} } } });
  } else {
    const ageBands = ['20-24','25-29','30-34','35-39','40-44','45-49','50-54','55+'];
    function ageBand(a){ if(a==null) return null; if(a<25) return '20-24'; if(a<30) return '25-29'; if(a<35) return '30-34'; if(a<40) return '35-39'; if(a<45) return '40-44'; if(a<50) return '45-49'; if(a<55) return '50-54'; return '55+'; }
    const ac = countBy(staff.filter(x=>x.age!=null), x=>ageBand(x.age));
    mkChart(containerId+'-extra', { type:'bar', data:{ labels:ageBands, datasets:[{data:ageBands.map(b=>ac.get(b)||0), backgroundColor:accent}] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{grid:{color:C.outline}}, x:{grid:{display:false}} } } });
  }

  const salVals = staff.map(costFn).filter(v=>v!=null && v>0);
  const bands = [[0,8000,'<8K'],[8000,15000,'8-15K'],[15000,25000,'15-25K'],[25000,40000,'25-40K'],[40000,999999,'40K+']];
  const salCounts = bands.map(b=>salVals.filter(v=>v>=b[0]&&v<b[1]).length);
  mkChart(containerId+'-salary', {
    type:'bar', data:{ labels:bands.map(b=>b[2]), datasets:[{ data:salCounts, backgroundColor:accent }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{grid:{color:C.outline}}, x:{grid:{display:false}} } }
  });
}

};

<script>
// ============================= COST ANALYSIS =============================
renderView.cost = function(){
  const root = document.getElementById('view-cost');
  const dxbTotal = COST_PROJ.dubaiTotal, indTotal = COST_PROJ.indiaTotal, combTotal = COST_PROJ.combinedTotal;
  const dxbCostSum = sum(DUBAI.map(trueCostDXB));
  const indCostSum = sum(INDIA.map(trueCostIND));
  const blendedAvg = (dxbCostSum+indCostSum)/(DUBAI.length+INDIA.length);

  const topCombinedDept = COST_PROJ.combined.slice().sort((a,b)=>b.monthlyBase-a.monthlyBase)[0];
  const indiaTempExceedsPerm = COST_PROJ.india.filter(d=>d.permanent>0 && d.temp>d.permanent);
  let costCalloutText = `<b>${topCombinedDept.dept} carries the heaviest combined run-rate</b> — ${fmtAED(topCombinedDept.monthlyBase)}/mo across both offices.`;
  if(indiaTempExceedsPerm.length){
    const d = indiaTempExceedsPerm[0];
    costCalloutText += ` In India, ${d.dept} temp spend (${fmtAED(d.temp)}/mo) exceeds permanent spend (${fmtAED(d.permanent)}/mo) — worth reviewing whether to convert that capacity to permanent headcount.`;
  } else {
    const secondDept = COST_PROJ.combined.slice().sort((a,b)=>b.monthlyBase-a.monthlyBase)[1];
    costCalloutText += ` ${secondDept.dept} follows at ${fmtAED(secondDept.monthlyBase)}/mo. No department currently has India temp spend outrunning its permanent spend.`;
  }

  root.innerHTML = `
    <div class="section-title"><h2>Cost Analysis</h2><div class="sub">Monthly payroll run-rate, department cost mix, and year-end projection — figures pulled directly from the Cost Projection tab</div></div>
    <div class="kpi-row">
      <div class="kpi"><div class="label">Combined Monthly Payroll</div><div class="value" style="font-size:21px;">${fmtAED(combTotal.monthlyBase)}</div><div class="foot">Permanent + temp, both offices</div></div>
      <div class="kpi"><div class="label">Dubai Monthly</div><div class="value" style="font-size:21px;">${fmtAED(dxbTotal.monthlyBase)}</div><div class="foot"><b>${fmtAED(dxbTotal.permanent)}</b> perm · <b>${fmtAED(dxbTotal.temp)}</b> temp</div></div>
      <div class="kpi"><div class="label">India Monthly</div><div class="value" style="font-size:21px;">${fmtAED(indTotal.monthlyBase)}</div><div class="foot"><b>${fmtAED(indTotal.permanent)}</b> perm · <b>${fmtAED(indTotal.temp)}</b> temp</div></div>
      <div class="kpi"><div class="label">Projected to Dec-26</div><div class="value" style="font-size:21px;">${fmtAED(combTotal.totalToYearEnd)}</div><div class="foot">6-month run-rate, Jul–Dec 2026</div></div>
      <div class="kpi"><div class="label">Avg. Cost / Head</div><div class="value" style="font-size:21px;">${fmtAED(blendedAvg)}</div><div class="foot">Blended, permanent staff only</div></div>
      <div class="kpi"><div class="label">Dubai Cut Saving</div><div class="value" style="font-size:21px;">${fmtAED(COST_PROJ.dubaiMonthlySaving)}</div><div class="foot">/mo · <b>${fmtAED(COST_PROJ.dubaiSixMonthSaving)}</b> over 6mo</div></div>
    </div>

    <div class="callout red">${costCalloutText}</div>

    <div class="section-title"><h2>Payroll by Department</h2><div class="sub">Permanent vs temp cost, monthly run-rate</div></div>
    <div class="grid grid-2">
      <div class="card"><h3>Dubai — Permanent vs Temp Cost</h3><div class="card-sub">By department, AED/month</div><div class="chart-wrap tall"><canvas id="cost-dxb-dept"></canvas></div></div>
      <div class="card"><h3>India — Permanent vs Temp Cost</h3><div class="card-sub">By department, AED/month</div><div class="chart-wrap tall"><canvas id="cost-ind-dept"></canvas></div></div>
    </div>

    <div class="section-title"><h2>Where the money goes</h2><div class="sub">Salary composition, cost by seniority, and per-head efficiency across offices</div></div>
    <div class="grid grid-3">
      <div class="card"><h3>Salary Bands</h3><div class="card-sub">Dubai vs India headcount, AED/month per head</div><div class="chart-wrap short"><canvas id="cost-bands"></canvas></div></div>
      <div class="card"><h3>Avg. Cost by Seniority</h3><div class="card-sub">Dubai vs India, AED/month per head</div><div class="chart-wrap short"><canvas id="cost-seniority"></canvas></div></div>
      <div class="card"><h3>Dubai Salary Components</h3><div class="card-sub">Aggregate monthly split</div><div class="chart-wrap short"><canvas id="cost-components"></canvas></div></div>
    </div>

    <div class="section-title"><h2>Salary Reduction Register</h2><div class="sub">Effective 01-Jun-2026, Dubai only — ${SAL_RED.length} employees affected</div></div>
    <div class="grid grid-2-1">
      <div class="card"><h3>Cut % Distribution</h3><div class="card-sub">How the reduction was applied across the roster</div><div class="chart-wrap short"><canvas id="cost-cutpct"></canvas></div></div>
      <div class="card"><h3>Reduction Summary</h3>
        <ul class="legend-list">
          <li><span class="name">Employees affected</span><span class="val">${SAL_RED.length}</span></li>
          <li><span class="name">Total monthly reduction</span><span class="val">${fmtAED(sum(SAL_RED.map(x=>x.reducedAmount)))}</span></li>
          <li><span class="name">Avg. cut applied</span><span class="val">${fmtPct(avg(SAL_RED.map(x=>x.cutPct*100)))}</span></li>
          <li><span class="name">Largest single reduction</span><span class="val">${fmtAED(Math.max(...SAL_RED.map(x=>x.reducedAmount||0)))}</span></li>
          <li><span class="name">Still in active roster</span><span class="val">${SAL_RED.filter(x=>x.inRoster==='Yes').length} of ${SAL_RED.length}</span></li>
        </ul>
      </div>
    </div>

    <div class="section-title"><h2>Top Cost Contributors</h2><div class="sub">Highest monthly-cost roles across both offices — searchable</div></div>
    <div class="filters">
      <input type="text" id="cost-search" placeholder="Search name, job title…">
      <select id="cost-loc-filter"><option value="">Both offices</option><option value="Dubai">Dubai</option><option value="India">India</option></select>
      <span class="count" id="cost-count"></span>
    </div>
    <div class="tbl-wrap">
      <table id="cost-table">
        <thead><tr><th data-k="name">Name</th><th data-k="location">Office</th><th data-k="dept">Dept</th><th data-k="jobTitle">Job Title</th><th data-k="cost">Monthly Cost (AED)</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  `;

  function deptStack(canvasId, arr){
    const rows = (arr||[]).filter(d=>d.monthlyBase>0);
    mkChart(canvasId, {
      type:'bar',
      data:{ labels: rows.map(d=>d.dept), datasets:[
        {label:'Permanent', data:rows.map(d=>d.permanent), backgroundColor:C.ink},
        {label:'Temp', data:rows.map(d=>d.temp), backgroundColor:C.red},
      ]},
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        scales:{ x:{stacked:true, grid:{color:C.outline}, ticks:{callback:v=>(v/1000)+'K'}}, y:{stacked:true, grid:{display:false}} },
        plugins:{ legend:{position:'top', align:'end'} } }
    });
  }
  deptStack('cost-dxb-dept', COST_PROJ.dubai);
  deptStack('cost-ind-dept', COST_PROJ.india);

  const bands = [[0,8000,'<8K'],[8000,15000,'8-15K'],[15000,25000,'15-25K'],[25000,40000,'25-40K'],[40000,999999,'40K+']];
  const dxbVals = DUBAI.map(trueCostDXB).filter(v=>v!=null&&v>0);
  const indVals = INDIA.map(trueCostIND).filter(v=>v!=null&&v>0);
  mkChart('cost-bands', {
    type:'bar', data:{ labels:bands.map(b=>b[2]), datasets:[
      {label:'Dubai', data:bands.map(b=>dxbVals.filter(v=>v>=b[0]&&v<b[1]).length), backgroundColor:C.ink},
      {label:'India', data:bands.map(b=>indVals.filter(v=>v>=b[0]&&v<b[1]).length), backgroundColor:C.red}] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'top',align:'end'}}, scales:{ y:{grid:{color:C.outline}}, x:{grid:{display:false}} } }
  });

  const senOrder = ['Director+','Principal','Lead/Associate','Senior','Engineer','Support/Admin'];
  function avgBySeniority(staff, costFn){
    return senOrder.map(s=>{ const grp = staff.filter(x=>seniorityBucket2(x.role)===s).map(costFn).filter(v=>v!=null&&v>0); return grp.length? avg(grp) : 0; });
  }
  mkChart('cost-seniority', {
    type:'bar', data:{ labels:senOrder, datasets:[
      {label:'Dubai', data:avgBySeniority(DUBAI, trueCostDXB), backgroundColor:C.ink},
      {label:'India', data:avgBySeniority(INDIA, trueCostIND), backgroundColor:C.red}] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'top',align:'end'}}, scales:{ x:{grid:{color:C.outline}, ticks:{callback:v=>(v/1000)+'K'}}, y:{grid:{display:false}} } }
  });

  const compTotals = { Basic: sum(DUBAI.map(x=>x.basic)), Accommodation: sum(DUBAI.map(x=>x.accommodation)), Transport: sum(DUBAI.map(x=>x.transport)), Flight: sum(DUBAI.map(x=>x.flight)) };
  mkChart('cost-components', {
    type:'doughnut', data:{ labels:Object.keys(compTotals), datasets:[{ data:Object.values(compTotals), backgroundColor:[C.ink,C.red,C.info,C.warning], borderWidth:2, borderColor:'#fff' }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'60%', plugins:{legend:{position:'bottom', labels:{boxWidth:8,boxHeight:8,font:{size:10.5}}}} }
  });

  const cutBands = ['≤5%','6-10%','11-15%','16-20%','20%+'];
  function cutBand(p){ const pct=p*100; if(pct<=5) return '≤5%'; if(pct<=10) return '6-10%'; if(pct<=15) return '11-15%'; if(pct<=20) return '16-20%'; return '20%+'; }
  const cutCounts = countBy(SAL_RED.filter(x=>x.cutPct!=null), x=>cutBand(x.cutPct));
  mkChart('cost-cutpct', {
    type:'bar', data:{ labels:cutBands, datasets:[{ data:cutBands.map(b=>cutCounts.get(b)||0), backgroundColor:C.red }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{grid:{color:C.outline}}, x:{grid:{display:false}} } }
  });

  const merged = DUBAI.map(x=>({name:x.name, location:'Dubai', dept:x.dept, jobTitle:x.jobTitle, cost:trueCostDXB(x)}))
    .concat(INDIA.map(x=>({name:x.name, location:x.location||'India', dept:x.dept, jobTitle:x.jobTitle, cost:trueCostIND(x)})));

  function renderCostTable(){
    const q = document.getElementById('cost-search').value.toLowerCase();
    const lf = document.getElementById('cost-loc-filter').value;
    let rows = merged.filter(x=>{
      if(lf==='Dubai' && x.location!=='Dubai') return false;
      if(lf==='India' && x.location==='Dubai') return false;
      if(q){ const hay=(x.name+' '+x.jobTitle).toLowerCase(); if(!hay.includes(q)) return false; }
      return true;
    }).sort((a,b)=>(b.cost||0)-(a.cost||0));
    document.getElementById('cost-count').innerHTML = `<b>${rows.length}</b> of ${merged.length}`;
    document.querySelector('#cost-table tbody').innerHTML = rows.slice(0,100).map(x=>`<tr>
      <td>${x.name||'—'}</td><td>${x.location==='Dubai'?'Dubai':x.location}</td>

function parseD(s){ if(!s) return null; const d = new Date(s); return isNaN(d) ? null : d; }
function normAgency(c){
  c = (c||'').trim();
  if(/bim engineers/i.test(c)) return 'The BIM Engineers';
  if(/prompt/i.test(c)) return 'Prompt Engineering';
  if(/commandtech/i.test(c)) return 'Commandtech';
  if(/^contract$/i.test(c)) return 'Direct Contract';
  if(/intern/i.test(c)) return 'Intern';
  if(/beyond/i.test(c)) return 'Beyond Finance/Commercial';
  return c || 'Unspecified';
}

<script>

renderView.attrition = function(){

  const currentHC = DUBAI.length + INDIA.length;
  const attritionRate = currentHC>0 ? (last12mo.length/(currentHC+last12mo.length)*100) : 0;
  const resignedCount = RESIGNED.filter(x=>x.exitType==='Resigned').length;
  const terminatedCount = RESIGNED.filter(x=>x.exitType==='Terminated').length;

  root.innerHTML = `
    <div class="section-title"><h2>Attrition &amp; Exits</h2><div class="sub">Resigned and terminated staff — India + Dubai combined</div></div>
    <div class="kpi-row">
      <div class="kpi"><div class="label">Total Exits Logged</div><div class="value">${RESIGNED.length}</div><div class="foot"><b>${withExit.length}</b> with confirmed last working day</div></div>
      <div class="kpi"><div class="label">Resigned</div><div class="value">${resignedCount}</div><div class="foot">Voluntary exits</div></div>
      <div class="kpi"><div class="label">Terminated</div><div class="value">${terminatedCount}</div><div class="foot">Involuntary exits</div></div>
      <div class="kpi"><div class="label">Unclassified</div><div class="value">${unclassifiedCount}</div><div class="foot">Needs tagging below</div></div>
      <div class="kpi"><div class="label">Exits, Last 12mo</div><div class="value">${last12mo.length}</div><div class="foot"><b>${attritionRate.toFixed(1)}%</b> annualised rate</div></div>
      <div class="kpi"><div class="label">Avg. Tenure at Exit</div><div class="value">${avgTenureExit?avgTenureExit.toFixed(1)+'y':'—'}</div><div class="foot">Join to last working day</div></div>
    </div>

    <div class="callout${unclassifiedCount>0?' red':''}"><b>${unclassifiedCount} of ${RESIGNED.length} logged exits are not yet classified</b> as Resigned or Terminated — the source "Resigned &amp; Terminated" sheet doesn't record the reason for exit, so every record starts Unclassified. Use the dropdown in the register below to tag each one; your choices are saved in this browser and feed the KPIs and charts above.</div>

    <div class="grid grid-2">
      <div class="card"><h3>Exit Trend</h3><div class="card-sub">Exits by month, last working day</div><div class="chart-wrap short"><canvas id="attr-trend"></canvas></div></div>
      <div class="card"><h3>Resigned / Terminated / Unclassified</h3><div class="card-sub">${RESIGNED.length} logged exits</div><div class="chart-wrap short"><canvas id="attr-exittype"></canvas></div></div>
    </div>

    <div class="grid grid-3" style="margin-top:16px;">
      <div class="card"><h3>Exits by Department</h3><div class="chart-wrap short"><canvas id="attr-dept"></canvas></div></div>
      <div class="card"><h3>Exits by Location</h3><div class="chart-wrap short"><canvas id="attr-loc"></canvas></div></div>
      <div class="card"><h3>Tenure at Exit</h3><div class="card-sub">Years served before leaving</div><div class="chart-wrap short"><canvas id="attr-tenure"></canvas></div></div>
    </div>

    <div class="section-title"><h2>Exit Register</h2><div class="sub">${RESIGNED.length} records — select multiple rows to classify them together, or use the dropdown per row</div></div>
    <div class="filters">
      <select id="attr-type-filter">
        <option value="">All types</option>
        <option value="Unclassified">Unclassified only</option>
        <option value="Resigned">Resigned only</option>
        <option value="Terminated">Terminated only</option>
      </select>
      <div class="bulk-actions" id="attr-bulk-actions">
        <span class="count" id="attr-selected-count">0 selected</span>
        <button class="btn btn-secondary" id="attr-bulk-resigned">Mark Resigned</button>
        <button class="btn btn-secondary" id="attr-bulk-terminated">Mark Terminated</button>
      </div>
      <span class="count" id="attr-count"></span>
    </div>
    <div class="tbl-wrap">
      <table id="attr-table">
        <thead><tr><th class="chk"><input type="checkbox" id="attr-select-all"></th><th>Name</th><th>Location</th><th>Dept</th><th>Job Title</th><th>Start</th><th>Last Working Day</th><th>Tenure</th><th>Type</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  `;

  mkChart('attr-trend', {
    type:'line', data:{ labels:months, datasets:[{ data:months.map(m=>monthMap.get(m)), borderColor:C.red, backgroundColor:C.redTint, fill:true, tension:.3, pointRadius:3, pointBackgroundColor:C.red }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, datalabels:{display:false}}, scales:{ y:{grid:{color:C.outline}, ticks:{stepSize:1}}, x:{grid:{display:false}} } }
  });

  mkChart('attr-exittype', {
    type:'doughnut', data:{ labels:['Resigned','Terminated','Unclassified'], datasets:[{ data:[resignedCount, terminatedCount, unclassifiedCount], backgroundColor:[C.info, C.danger, C.n400], borderWidth:2, borderColor:'#fff' }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'60%', plugins:{legend:{position:'bottom'}} }
  });

  mkChart('attr-dept', { type:'bar', data:{ labels:deptCounts.map(d=>d[0]), datasets:[{data:deptCounts.map(d=>d[1]), backgroundColor:C.red}] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{color:C.outline}}, y:{grid:{display:false}} } } });

  mkChart('attr-loc', { type:'doughnut', data:{ labels:locCounts.map(d=>d[0]), datasets:[{data:locCounts.map(d=>d[1]), backgroundColor:C.palette, borderWidth:2, borderColor:'#fff'}] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'60%', plugins:{legend:{position:'bottom', labels:{boxWidth:8,boxHeight:8,font:{size:10.5}}}} } });

  const tBands = ['<1y','1-2y','2-3y','3y+'];
  function tb(t){ if(t<1) return '<1y'; if(t<2) return '1-2y'; if(t<3) return '2-3y'; return '3y+'; }
  const tCounts = countBy(tenures, tb);
  mkChart('attr-tenure', { type:'bar', data:{ labels:tBands, datasets:[{data:tBands.map(b=>tCounts.get(b)||0), backgroundColor:C.warning}] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{grid:{color:C.outline}}, x:{grid:{display:false}} } } });

  let attrSelectedKeys = new Set();

  function updateBulkBar(){
    const bar = document.getElementById('attr-bulk-actions');
    const n = attrSelectedKeys.size;
    document.getElementById('attr-selected-count').textContent = n + ' selected';
    bar.classList.toggle('show', n>0);
  }

  function renderRegister(){
    const tf = document.getElementById('attr-type-filter').value;
    let rows = RESIGNED.slice().sort((a,b)=>(b.lastWorkingDay||'').localeCompare(a.lastWorkingDay||''));
    if(tf) rows = rows.filter(x=>x.exitType===tf);
    document.getElementById('attr-count').innerHTML = `<b>${rows.length}</b> of ${RESIGNED.length}`;
    document.querySelector('#attr-table tbody').innerHTML = rows.map(x=>{
      const t = tenureYears(x.startDate, x.lastWorkingDay);
      const key = exitKey(x);
      return `<tr>
        <td class="chk"><input type="checkbox" class="attr-row-check" data-key="${key}" ${attrSelectedKeys.has(key)?'checked':''}></td>
        <td>${x.name||'—'}</td><td>${x.location||'—'}</td><td><span class="pill dept">${x.department||'—'}</span></td>
        <td>${x.jobTitle||'—'}</td><td>${x.startDate||'—'}</td><td>${x.lastWorkingDay||'<span style="color:'+C.n600+'">Pending</span>'}</td>
        <td class="mono">${t?t.toFixed(1)+'y':'—'}</td>
        <td><select class="attr-type-select" data-key="${key}">
              <option value="Unclassified" ${x.exitType==='Unclassified'?'selected':''}>Unclassified</option>
              <option value="Resigned" ${x.exitType==='Resigned'?'selected':''}>Resigned</option>
              <option value="Terminated" ${x.exitType==='Terminated'?'selected':''}>Terminated</option>
            </select></td>
      </tr>`;
    }).join('');
    document.querySelectorAll('.attr-type-select').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const key = sel.dataset.key;
        const rec = RESIGNED.find(x=>exitKey(x)===key);
        if(rec) rec.exitType = sel.value;
        saveExitTypeOverride(key, sel.value);
        renderView.attrition();
        rendered.attrition = true;
      });
    });
    document.querySelectorAll('.attr-row-check').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const key = cb.dataset.key;
        if(cb.checked) attrSelectedKeys.add(key); else attrSelectedKeys.delete(key);
        document.getElementById('attr-select-all').checked = document.querySelectorAll('.attr-row-check').length>0 && document.querySelectorAll('.attr-row-check:checked').length===document.querySelectorAll('.attr-row-check').length;
        updateBulkBar();
      });
    });
    document.getElementById('attr-select-all').checked = false;
    updateBulkBar();
  }
  document.getElementById('attr-select-all').addEventListener('change', (e)=>{
    document.querySelectorAll('.attr-row-check').forEach(cb=>{
      cb.checked = e.target.checked;
      const key = cb.dataset.key;
      if(e.target.checked) attrSelectedKeys.add(key); else attrSelectedKeys.delete(key);
    });
    updateBulkBar();
  });
  function bulkApply(type){
    if(attrSelectedKeys.size===0) return;
    attrSelectedKeys.forEach(key=>{
      const rec = RESIGNED.find(x=>exitKey(x)===key);
      if(rec) rec.exitType = type;
      saveExitTypeOverride(key, type);
    });
    attrSelectedKeys.clear();
    renderView.attrition();
    rendered.attrition = true;
  }
  document.getElementById('attr-bulk-resigned').addEventListener('click', ()=>bulkApply('Resigned'));
  document.getElementById('attr-bulk-terminated').addEventListener('click', ()=>bulkApply('Terminated'));
  document.getElementById('attr-type-filter').addEventListener('change', renderRegister);
  renderRegister();
};

  'Notes': ['notes'],
};
function fmtVal(k,v){
  if(v===null||v===undefined||v==='') return '—';
  if(/salary|cost|^basic$|accommodation|transport|flight/i.test(k) && typeof v==='number') return fmtAED(v);
  if((k==='salaryCutPct'||k==='bonusPct') && typeof v==='number') return (v<=1? (v*100):v).toFixed(0)+'%';
  if((k==='yearsIn9E'||k==='totalExp'||k==='yearsExpFromGrad') && typeof v==='number') return v.toFixed(1)+' yrs';
  return esc(v);
}
function openEmpDetail(emp){
  document.getElementById('empDetailName').textContent = emp.name || 'Employee';
  document.getElementById('empDetailSub').textContent = [emp.jobTitle, emp.dept, emp.office==='Dubai'?'Dubai':(emp.location||'India')].filter(Boolean).join(' · ');
  const grid = document.getElementById('empDetailGrid');
  let html = '';
  Object.entries(SECTION_MAP).forEach(([section, keys])=>{
    const present = keys.filter(k => emp[k]!==undefined && emp[k]!==null && emp[k]!=='');
    if(!present.length) return;
    html += `<div class="detail-section-title">${section}</div>`;
    present.forEach(k=>{ html += `<div class="detail-item"><div class="k">${FIELD_LABELS[k]||k}</div><div class="v">${fmtVal(k, emp[k])}</div></div>`; });
  });
  grid.innerHTML = html || '<div class="detail-item full">No further details recorded.</div>';
  document.getElementById('empDetailOverlay').classList.add('open');
}
document.getElementById('empDetailClose').addEventListener('click', ()=>{ document.getElementById('empDetailOverlay').classList.remove('open'); });

const addEmpOverlay = document.getElementById('addEmpOverlay');
const addEmpForm = document.getElementById('addEmpForm');
document.getElementById('addEmpOffice').addEventListener('change', e=>{ document.getElementById('addEmpCityWrap').style.display = e.target.value==='India' ? 'block' : 'none'; });
function openAddEmpModal(){ addEmpOverlay.classList.add('open'); }
function closeAddEmpModal(){ addEmpOverlay.classList.remove('open'); addEmpForm.reset(); }
document.getElementById('addEmpClose').addEventListener('click', closeAddEmpModal);
document.getElementById('addEmpCancel').addEventListener('click', closeAddEmpModal);
[document.getElementById('empDetailOverlay'), addEmpOverlay].forEach(ov=>{ ov.addEventListener('click', e=>{ if(e.target===ov) ov.classList.remove('open'); }); });

document.getElementById('addEmpSave').addEventListener('click', ()=>{
  if(!addEmpForm.checkValidity()){ addEmpForm.reportValidity(); return; }
  const fd = new FormData(addEmpForm);
  const office = fd.get('office');
  const salaryVal = fd.get('salary') ? +fd.get('salary') : null;
  const startDate = fd.get('startDate') || null;
  const tenure = startDate ? +(((new Date())-new Date(startDate))/(1000*3600*24*365.25)).toFixed(1) : null;
  const emp = {
    office, name: fd.get('name'), payroll: fd.get('payroll') || ('EMP-'+Date.now()),
    dept: fd.get('dept')||null, jobTitle: fd.get('jobTitle')||null, role: fd.get('role')||null,
    lineManager: fd.get('lineManager')||null,
    gender: fd.get('gender')||null, nationality: fd.get('nationality')||null,
    age: fd.get('age')? +fd.get('age') : null, startDate, yearsIn9E: tenure,
    contractType: fd.get('contractType')||'Permanent',
    degree: fd.get('degreeField')||null, university: fd.get('universityField')||null,
    notes: fd.get('notes')||null,
  };
  if(office==='Dubai'){ emp.salary = salaryVal; emp.effectiveSalary = salaryVal; DUBAI.push(emp); }
  else { emp.location = fd.get('location')||'India'; emp.salaryAED = salaryVal; emp.totalCostToAccess = salaryVal; INDIA.push(emp); }
  saveCustomEmployee(emp);
  rebuildAllPerm();
  Object.keys(rendered).forEach(k=>delete rendered[k]);
  closeAddEmpModal();
  renderView.directory(); rendered.directory = true;
  goToTab('directory');
});

let dirOffice = 'Dubai';
renderView.directory = function(){
  const root = document.getElementById('view-directory');
  root.innerHTML = `
    <div class="section-title">
      <h2>Employee Directory</h2>
      <div class="sub">${ALL_PERM.length} permanent staff — India + Dubai. Click any row for the full profile.</div>
    </div>
    <div class="filters">
      <div class="seg" id="dir-office-seg">
        <button data-office="Dubai" class="active">Dubai (${DUBAI.length})</button>
        <button data-office="India">India (${INDIA.length})</button>
      </div>
      <input type="text" id="dir-search" placeholder="Search name, job title, payroll no…">
      <select id="dir-dept-filter"><option value="">All departments</option></select>
      <select id="dir-gender-filter"><option value="">All genders</option><option value="Male">Male</option><option value="Female">Female</option></select>
      <button class="btn btn-primary" id="dir-add-btn">+ Add Employee</button>
      <span class="count" id="dir-count"></span>
    </div>
    <div class="tbl-wrap">
      <table id="dir-table">
        <thead><tr>
          <th data-k="name" style="width:15%;">Name</th><th data-k="payroll" style="width:9%;">Payroll No.</th><th data-k="location" style="width:9%;">Office / City</th>
          <th data-k="dept" style="width:11%;">Dept</th><th data-k="jobTitle" style="width:20%;">Job Title</th><th data-k="lineManager" style="width:13%;">Line Manager</th>
          <th data-k="gender" style="width:8%;">Gender</th><th data-k="cost" style="width:9%;">Monthly Salary</th><th data-k="startDate" style="width:6%;">Joined</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  `;
  document.getElementById('dir-add-btn').addEventListener('click', openAddEmpModal);

  document.getElementById('dir-office-seg').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-office]');
    if(!btn) return;
    dirOffice = btn.dataset.office;
    document.querySelectorAll('#dir-office-seg button').forEach(b=>b.classList.toggle('active', b===btn));
    populateDeptFilter();
    renderTable();
  });

  const deptSel = document.getElementById('dir-dept-filter');
  function populateDeptFilter(){
    deptSel.innerHTML = '<option value="">All departments</option>';
    const src = dirOffice==='Dubai' ? DUBAI : INDIA;
    [...new Set(src.map(x=>x.dept).filter(Boolean))].sort().forEach(d=>deptSel.appendChild(el(`<option value="${d}">${d}</option>`)));
  }
  populateDeptFilter();

  let sortKey = 'name', sortDir = 1, currentRows = [];

  function renderTable(){
    const q = document.getElementById('dir-search').value.toLowerCase();
    const df = document.getElementById('dir-dept-filter').value;
    const gf = document.getElementById('dir-gender-filter').value;
    let rows = ALL_PERM.filter(x=>x.office===dirOffice).filter(x=>{
      if(df && x.dept!==df) return false;
      if(gf && x.gender!==gf) return false;
      if(q){ const hay=[x.name,x.jobTitle,x.payroll,x.role,x.lineManager].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
      return true;
    });
    rows = rows.slice().sort((a,b)=>{
      let av = sortKey==='cost' ? trueCost(a) : a[sortKey];
      let bv = sortKey==='cost' ? trueCost(b) : b[sortKey];
      if(av==null) av = typeof bv==='number' ? -Infinity : '';
      if(bv==null) bv = typeof av==='number' ? -Infinity : '';
      if(typeof av==='string') return av.localeCompare(bv)*sortDir;
      return (av-bv)*sortDir;
    });
    currentRows = rows;
    document.getElementById('dir-count').innerHTML = `<b>${rows.length}</b> of ${dirOffice==='Dubai'?DUBAI.length:INDIA.length} ${dirOffice}`;
    document.querySelector('#dir-table tbody').innerHTML = rows.map((x,i)=>`<tr class="clickable" data-idx="${i}">
      <td>${esc(x.name)||'—'}</td><td class="mono">${esc(x.payroll)||'—'}</td>
      <td>${x.office==='Dubai'?'Dubai':(esc(x.location)||'India')}</td>
      <td><span class="pill dept">${esc(x.dept)||'—'}</span></td>
      <td>${esc(x.jobTitle)||'—'}</td>
      <td>${esc(x.lineManager)||'—'}</td>
      <td><span class="pill ${x.gender==='Female'?'f':'m'}">${esc(x.gender)||'—'}</span></td>
      <td class="mono">${trueCost(x)?fmtAED(trueCost(x)):'—'}</td>
      <td class="mono">${esc(x.startDate)||'—'}</td>
    </tr>`).join('');
    document.querySelectorAll('#dir-table tbody tr').forEach(tr=>{ tr.addEventListener('click', ()=> openEmpDetail(currentRows[+tr.dataset.idx])); });
  }

  document.querySelectorAll('#dir-table th[data-k]').forEach(th=>{
    th.addEventListener('click', ()=>{ const k = th.dataset.k; if(sortKey===k) sortDir *= -1; else { sortKey=k; sortDir=1; } renderTable(); });
  });
  ['dir-search','dir-dept-filter','dir-gender-filter'].forEach(id=>{
    const evt = id==='dir-search' ? 'input' : 'change';
    document.getElementById(id).addEventListener(evt, renderTable);
  });
  renderTable();
};
</script>

<script>
// ============================= EXPORTS: Excel backup + Board PPT =============================
function exportToExcel(){
  try{
    if(!window.XLSX){ alert('The Excel library did not load — check your internet connection and try again.'); return; }
    const wb = XLSX.utils.book_new();
    const addSheet = (name, arr)=>{
      if(!arr || !arr.length) return;
      const ws = XLSX.utils.json_to_sheet(arr);
      XLSX.utils.book_append_sheet(wb, ws, name.substring(0,31));
    };
    addSheet('Dubai', DUBAI);
    addSheet('India', INDIA);
    addSheet('Temp Staff', TEMP);
    addSheet('Resigned-Terminated', RESIGNED);
    addSheet('Dubai Cost by Dept', COST_PROJ.dubai);
    addSheet('India Cost by Dept', COST_PROJ.india);
    addSheet('Combined Cost by Dept', COST_PROJ.combined);
    addSheet('Salary Reduction', SAL_RED);
    XLSX.writeFile(wb, '9E_Workforce_Backup_'+new Date().toISOString().slice(0,10)+'.xlsx');
  }catch(err){
    console.error('Excel export failed', err);
    alert('Excel export failed: '+err.message+'\n\nCheck the browser console for details.');
  }
}
const excelBtn = document.getElementById('btnExportExcel');
if(excelBtn) excelBtn.addEventListener('click', exportToExcel);

function buildBoardPPT(){
  try{
    if(!window.PptxGenJS){ alert('The PowerPoint library did not load — check your internet connection and try again.'); return; }
    ['overview','cost','attrition'].forEach(v=>{ if(!rendered[v]){ renderView[v](); rendered[v]=true; } });
    // animations are disabled globally, so a short delay is enough for canvases to paint
    setTimeout(()=>{
      try{
        const pptx = new PptxGenJS();
        pptx.defineLayout({name:'WIDE', width:13.33, height:7.5});
        pptx.layout = 'WIDE';
        const RED='D6242F', INK='4A4A4E', SOFT='7E7E7E', PAPER='F5F5F5', LINE='E0E0E0';

        let s = pptx.addSlide();
        s.background = { color: INK };
        s.addShape('rect', {x:0,y:0,w:13.33,h:0.12,fill:{color:RED}});
        s.addText('9E Global — Workforce Intelligence', {x:0.6,y:2.8,w:12,h:1,fontSize:32,bold:true,color:'FFFFFF',fontFace:'Arial'});
        s.addText('Board Summary · Generated '+new Date().toLocaleDateString(), {x:0.6,y:3.7,w:12,h:0.5,fontSize:14,color:'BFBFBF',fontFace:'Arial'});

        const total = DUBAI.length + INDIA.length;
        const male = ALL_PERM.filter(x=>x.gender==='Male').length;
        const female = ALL_PERM.filter(x=>x.gender==='Female').length;
        const activeTemp = TEMP.filter(x=>x.status==='Active');
        const activeTempCost = sum(activeTemp.map(x=>x.monthlyCost));
        const resignedN = RESIGNED.filter(x=>x.exitType==='Resigned').length;
        const terminatedN = RESIGNED.filter(x=>x.exitType==='Terminated').length;
        const unclassifiedN = RESIGNED.filter(x=>x.exitType==='Unclassified').length;
        const kpis = [
          ['Total Headcount', total, DUBAI.length+' Dubai · '+INDIA.length+' India'],
          ['Gender Split', male+':'+female, (total?(female/total*100).toFixed(0):0)+'% female'],
          ['Active Temp Staff', activeTemp.length, fmtAED(activeTempCost)+'/mo'],
          ['Monthly Payroll', fmtAED(COST_PROJ.combinedTotal.monthlyBase), 'Permanent + temp'],
          ['Exits Logged', RESIGNED.length, 'India + Dubai'],
          ['Resigned / Terminated / Unclassified', resignedN+' / '+terminatedN+' / '+unclassifiedN, 'Of '+RESIGNED.length+' logged exits'],
        ];
        s = pptx.addSlide();
        s.addText('Firm-wide Snapshot', {x:0.5,y:0.35,w:12,h:0.6,fontSize:22,bold:true,color:INK,fontFace:'Arial'});
        kpis.forEach((k,i)=>{
          const x = 0.5 + (i%3)*4.2, y = 1.3 + Math.floor(i/3)*2.1;
          s.addShape('rect', {x,y,w:3.9,h:1.85,fill:{color:PAPER},line:{color:LINE,width:1}});
          s.addText(String(k[0]).toUpperCase(), {x:x+0.2,y:y+0.15,w:3.5,h:0.3,fontSize:9,bold:true,color:RED,fontFace:'Arial'});
          s.addText(String(k[1]), {x:x+0.2,y:y+0.5,w:3.5,h:0.75,fontSize:22,bold:true,color:INK,fontFace:'Arial'});
          s.addText(String(k[2]), {x:x+0.2,y:y+1.25,w:3.5,h:0.5,fontSize:10,color:SOFT,fontFace:'Arial'});
        });

        const chartSlides = [
          ['ov-dept-office','Headcount by Department & Office'],
          ['cost-dxb-dept','Dubai — Payroll by Department'],
          ['cost-ind-dept','India — Payroll by Department'],
          ['attr-dept','Exits by Department'],
          ['attr-exittype','Resigned / Terminated / Unclassified'],
        ];
        let imagesAdded = 0;
        chartSlides.forEach(([id,title])=>{
          const canvas = document.getElementById(id);
          if(!canvas) return;
          let img;
          try{ img = canvas.toDataURL('image/png',1.0); }catch(e){ console.warn('Could not capture chart', id, e); return; }
          const s2 = pptx.addSlide();
          s2.addText(title, {x:0.5,y:0.35,w:12,h:0.6,fontSize:20,bold:true,color:INK,fontFace:'Arial'});
          s2.addImage({data:img, x:1.6, y:1.2, w:10.1, h:5.6});
          imagesAdded++;
        });

        pptx.writeFile({fileName:'9E_Board_Summary_'+new Date().toISOString().slice(0,10)+'.pptx'}).then(()=>{
          if(imagesAdded < chartSlides.length){
            console.warn('Some chart images could not be captured for the PPT (', imagesAdded, 'of', chartSlides.length, ')');
          }
        }).catch(err=>{
          console.error('PPT write failed', err);
          alert('PowerPoint export failed while saving the file: '+err.message);
        });
      }catch(err){
        console.error('PPT build failed', err);
        alert('PowerPoint export failed: '+err.message+'\n\nCheck the browser console for details.');
      }
    }, 500);
  }catch(err){
    console.error('PPT export failed', err);
    alert('PowerPoint export failed: '+err.message);
  }
}
const pptBtn = document.getElementById('btnExportPPT');
if(pptBtn) pptBtn.addEventListener('click', buildBoardPPT);

// ============================= INIT =============================
renderView.overview();
rendered.overview = true;
</script>
